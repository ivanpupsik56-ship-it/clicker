<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>КЛІКЕР 🇺🇦</title>


<script src="https://telegram.org/js/telegram-web-app.js"></script>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<h1>КЛІКЕР 🇺🇦</h1>



<div class="coins">

🪙 <span id="coins">0</span>

</div>




<img 
id="avatar"
class="avatar"
src="characters/avatar.png"
alt="Персонаж"
>




<button id="click">

КЛІК!

</button>





<button id="shopBtn">

🛒 МАГАЗИН

</button>







<div id="shop" class="shop hidden">



<h2>🛒 МАГАЗИН</h2>





<!-- ПЕРВЫЙ ПЕРСОНАЖ -->

<div class="card">


<img src="characters/bald.png">


<h3>Лисий Чемпіон</h3>


<p>⚡ +2 монети за клік</p>


<p>💰 Ціна: 100 🪙</p>


<button id="buyBald">

КУПИТИ

</button>


</div>








<!-- ВТОРОЙ ПЕРСОНАЖ -->

<div class="card">


<img src="characters/puzatik.png">


<h3>Пузатик 🐷</h3>


<p>⚡ +5 монет за клік</p>


<p>💰 Ціна: 750 🪙</p>


<button id="buyBoss">

КУПИТИ

</button>


</div>








<button id="closeShop">

❌ Закрити

</button>




</div>



</div>





<script src="app.js"></script>


</body>


</html>
