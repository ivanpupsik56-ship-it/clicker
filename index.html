<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>КЛІКЕР 🇺🇦</title>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style.css">

</head>


<body>


<audio id="music" loop>
    <source src="sounds/background.mp3" type="audio/mpeg">
</audio>



<div class="game">


<h1>
КЛІКЕР 🇺🇦
</h1>



<div class="coins">
🪙 <span id="coins">0</span>
</div>




<img
id="avatar"
class="avatar"
src="characters/avatar.png"
>






<button id="click">
КЛІК!
</button>






<button id="shopBtn">
🛒 МАГАЗИН
</button>








<div id="shop" class="shop hidden">



<h2>
🛒 МАГАЗИН
</h2>





<div class="card">


<img src="characters/bald.png">


<h3>
Лисий Чемпіон
</h3>


<p>
⚡ +2 за клік
</p>


<p>
💰 100 🪙
</p>


<button id="buyBald">
КУПИТИ
</button>


</div>







<div class="card">


<img src="characters/puzatik.png">


<h3>
Пузатик 🐷
</h3>


<p>
⚡ +5 за клік
</p>


<p>
💰 750 🪙
</p>


<button id="buyBoss">
КУПИТИ
</button>


</div>








<div class="card">


<img src="characters/boss.png">


<h3>
Босс 😎🐷
</h3>


<p>
⚡ +10 за клік
</p>


<p>
💰 1500 🪙
</p>


<button id="buyBoss2">
КУПИТИ
</button>


</div>







<button id="closeShop">
⬅️ НАЗАД
</button>




</div>





</div>




<script src="app.js"></script>


</body>

</html>
