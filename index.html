<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>КЛІКЕР 🇺🇦</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ФОНОВАЯ МУЗЫКА -->
<audio id="music" loop preload="auto">
    <source src="sounds/background.mp3" type="audio/mpeg">
</audio>


<div class="game">

    <h1>КЛІКЕР 🇺🇦</h1>

    <!-- МОНЕТЫ -->
    <div class="coins">
        🪙 <span id="coins">0</span>
    </div>


    <!-- ГЛАВНЫЙ ПЕРСОНАЖ -->
    <img
        id="avatar"
        class="avatar"
        src="characters/avatar.png"
        alt="Персонаж"
    >


    <!-- КНОПКА КЛИКА -->
    <button id="click">
        КЛІК!
    </button>


    <!-- КНОПКА МАГАЗИНА -->
    <button id="shopBtn">
        🛒 МАГАЗИН
    </button>



    <!-- ====================== -->
    <!--        МАГАЗИН         -->
    <!-- ====================== -->

    <div id="shop" class="shop hidden">

        <h2>🛒 МАГАЗИН</h2>


        <!-- ЛИСЫЙ ЧЕМПИОН -->
        <div class="card">

            <img
                src="characters/bald.png"
                alt="Лисий Чемпион"
            >

            <h3>
                Лисий Чемпион
            </h3>

            <p>
                ⚡ +2 за клик
            </p>

            <p>
                💰 Цена: 100 🪙
            </p>

            <button id="buyBald">
                КУПИТИ
            </button>

        </div>



        <!-- ПУЗАТИК -->
        <div class="card">

            <img
                src="characters/puzatik.png"
                alt="Пузатик"
            >

            <h3>
                Пузатик 🐷
            </h3>

            <p>
                ⚡ +5 за клик
            </p>

            <p>
                💰 Цена: 750 🪙
            </p>

            <button id="buyBoss">
                КУПИТИ
            </button>

        </div>



        <!-- БОСС -->
        <div class="card">

            <img
                src="characters/boss.png"
                alt="Босс"
            >

            <h3>
                Босс 😎🐷
            </h3>

            <p>
                ⚡ +10 за клик
            </p>

            <p>
                💰 Цена: 1500 🪙
            </p>

            <button id="buyBoss2">
                КУПИТИ
            </button>

        </div>



        <!-- КОЧ БРАТАН -->
        <div class="card">

            <img
                src="characters/koch.png"
                alt="Коч братан"
            >

            <h3>
                Коч братан 🪣
            </h3>

            <p>
                ⚡ +20 за клик
            </p>

            <p>
                💰 Цена: 2000 🪙
            </p>

            <button id="buyKoch">
                КУПИТИ
            </button>

        </div>



        <!-- МЕЛЛСТРОЙ -->
        <div class="card">

            <img
                src="characters/mellstroy.jpg"
                alt="Меллстрой"
            >

            <h3>
                Меллстрой 💸
            </h3>

            <p>
                ⚡ +50 за клик
            </p>

            <p>
                💰 Цена: 5000 🪙
            </p>

            <button id="buyMellstroy">
                КУПИТИ
            </button>

        </div>



        <!-- НАЗАД -->
        <button id="closeShop">
            ⬅️ НАЗАД
        </button>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
